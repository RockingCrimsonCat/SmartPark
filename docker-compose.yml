# Запуск усієї системи: docker compose up --build
# Веб-клієнт: http://localhost:8080   Swagger: http://localhost:5000/swagger
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartpark
      POSTGRES_USER: smartpark
      POSTGRES_PASSWORD: smartpark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpark -d smartpark"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/SmartPark.Server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=smartpark;Username=smartpark;Password=smartpark
      Storage__ReceiptsPath: /data/receipts
      Storage__LogsPath: /data/logs
      Client__BaseUrl: http://localhost:8080
      TZ: Europe/Kyiv
    ports:
      - "5000:5000"
    volumes:
      - appdata:/data

  web:
    build:
      context: client
    depends_on:
      - api
    ports:
      - "8080:80"

  simulator:
    build:
      context: .
      dockerfile: src/SmartPark.Simulator/Dockerfile
    depends_on:
      - api
    environment:
      SERVER_URL: http://api:5000
      EDGE_KEY: dev-edge-key
      PARKING_ID: 11111111-1111-1111-1111-111111111111
      SIM_DATA: /sim-data
    command: ["--auto"]
    profiles: ["auto-sim"]
    volumes:
      - simdata:/sim-data

  # Щоденне резервне копіювання БД (pg_dump) в окремий том.
  backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: smartpark
    entrypoint: >
      sh -c "while true; do
        pg_dump -h db -U smartpark smartpark > /backups/smartpark-$$(date +%F).sql;
        find /backups -name '*.sql' -mtime +7 -delete;
        sleep 86400; done"
    volumes:
      - backups:/backups

volumes:
  pgdata:
  appdata:
  simdata:
  backups:
